<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valheim · sign in</title>
<style>
  :root {
    --bg: #12100e; --panel: #1b1815; --line: #2e2822;
    --ink: #ece5da; --dim: #9a8f80; --accent: #d8a24a; --bad: #d9614f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(1200px 600px at 50% -10%, #241d15, var(--bg));
    color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  form {
    width: min(360px, 92vw); background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 28px 26px; box-shadow: 0 20px 60px #0008;
  }
  h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: .2px; }
  p.sub { margin: 0 0 22px; color: var(--dim); font-size: 13px; }
  label { display: block; font-size: 12px; text-transform: uppercase;
          letter-spacing: .08em; color: var(--dim); margin-bottom: 7px; }
  input {
    width: 100%; padding: 11px 12px; border-radius: 9px; border: 1px solid var(--line);
    background: #14110e; color: var(--ink); font-size: 15px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .field { margin-bottom: 15px; }
  button {
    margin-top: 6px; width: 100%; padding: 11px; border: 0; border-radius: 9px;
    background: var(--accent); color: #201708; font-weight: 650; font-size: 15px;
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .err { margin-top: 14px; color: var(--bad); font-size: 13px; min-height: 18px; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Valheim panel</h1>
  <p class="sub">FGR · GunungpatiJaya</p>
  <div class="field">
    <label for="u">Username</label>
    <input id="u" name="username" type="text" autocomplete="username" required autofocus>
  </div>
  <div class="field">
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required>
  </div>
  <button id="b" type="submit">Sign in</button>
  <div class="err" id="e"></div>
</form>
<script>
const f = document.getElementById('f'), b = document.getElementById('b'), e = document.getElementById('e');
f.addEventListener('submit', async ev => {
  ev.preventDefault();
  b.disabled = true; e.textContent = '';
  try {
    const r = await fetch('/api/v1/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: new URLSearchParams({
        username: document.getElementById('u').value,
        password: document.getElementById('pw').value
      })
    });
    const d = await r.json().catch(() => ({}));
    if (r.ok) { location.href = '/'; return; }
    e.textContent = d.error || ('HTTP ' + r.status);
  } catch (err) {
    e.textContent = 'network error';
  }
  b.disabled = false;
});
</script>
</body>
</html>
